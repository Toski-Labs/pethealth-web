name: CI

# Roda o mesmo comando que você roda na máquina (npm run ci). Sem deploy: o deploy é manual.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium do Playwright: usado pelo axe e pelo Lighthouse CI (scripts/lighthouse.mjs aponta para ele).
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
