name: CI

# Roda o mesmo comando que você roda na máquina (npm run ci). Sem deploy: o deploy é manual.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04 # fixo: o ubuntu-latest vira Ubuntu 26 em 19/out
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O Ubuntu do runner bloqueia o sandbox do Chrome ("No usable sandbox!"), e o Lighthouse CI abre o Chrome
      # pelo Puppeteer nos perfis escuros. Libera o sandbox em vez de usar --no-sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Chromium do Playwright: usado pelo axe e pelo Lighthouse CI (scripts/lighthouse.mjs aponta para ele).
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
